spring:
  application:
    name: rindo

  # Java 21: cada peticion HTTP corre en un hilo virtual en lugar de uno de plataforma.
  # Las llamadas bloqueantes (base de datos, S3, Gemini) dejan de retener un hilo del SO,
  # que es justo el perfil de carga de este backend.
  threads:
    virtual:
      enabled: true

  jpa:
    # Desactivado a proposito: open-in-view mantiene la sesion de Hibernate abierta durante
    # el renderizado de la respuesta, lo que provoca consultas N+1 invisibles y retiene
    # conexiones del pool mas tiempo del necesario.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Sin baseline-on-migrate: el esquema se construye siempre desde V1, de modo que una
    # base de datos con tablas pero sin historial de Flyway falle en vez de continuar en
    # silencio sobre un estado desconocido.

management:
  endpoints:
    web:
      exposure:
        # Solo lo necesario. Cada endpoint expuesto es superficie de ataque.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.rindo: INFO
