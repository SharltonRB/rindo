name: backend

# Filtros por ruta: un cambio que solo toca frontend/ o docs/ no dispara esta build.
# Es la contrapartida obligatoria del monorepo, segun el ADR-003.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

# Un push nuevo sobre la misma rama cancela la ejecucion anterior: no tiene sentido
# gastar diez minutos compilando a nativo un commit que ya quedo obsoleto.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    name: Tests y verificacion de modulos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Docker viene preinstalado en los runners de Ubuntu, asi que Testcontainers
      # levanta PostgreSQL sin configuracion adicional.
      - name: Ejecutar la suite
        run: ./mvnw -B verify

      - name: Publicar los informes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-surefire
          path: backend/target/surefire-reports/
          retention-days: 7

  native:
    name: Compilacion nativa con GraalVM
    needs: verify
    runs-on: ubuntu-latest
    # native-image es lento por diseno: analiza el grafo completo de clases alcanzables.
    # Los runners de GitHub tienen 16 GB de RAM, holgura que una portatil de 8 GB no da.
    timeout-minutes: 45

    # PostgreSQL efimero para arrancar el binario de verdad. Las credenciales nacen y
    # mueren con el runner: no son un secreto y no valen fuera de este job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rindo
          POSTGRES_USER: rindo
          POSTGRES_PASSWORD: rindo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # GraalVM 25, no 21: el native-maven-plugin de Spring Boot 4.1 usa el formato nuevo
      # de reachability metadata, que las versiones de la linea 21 no entienden.
      # El bytecode se sigue generando para Java 21 (java.version en el pom).
      - name: Configurar GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar a binario nativo
        run: ./mvnw -B -Pnative native:compile -DskipTests

      # Que native-image termine sin error no demuestra nada: el binario puede compilar,
      # arrancar y morir al inicializar el contexto si falta metadata de reflexion. Por eso
      # aqui se exige el arranque COMPLETO ("Started RindoApplication") y una respuesta real
      # del endpoint de salud. Una linea intermedia como "Starting AOT-processed" aparece
      # tambien cuando la aplicacion se cae justo despues, asi que no sirve como criterio.
      - name: Comprobar que el binario arranca y responde
        run: |
          ./target/rindo \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/rindo \
            --spring.datasource.username=rindo \
            --spring.datasource.password=rindo \
            --server.port=8080 > arranque.log 2>&1 &
          PID=$!

          for _ in $(seq 1 60); do
            grep -q "Started RindoApplication" arranque.log && break
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done

          echo "----- salida del binario -----"
          cat arranque.log
          echo "------------------------------"

          if ! grep -q "Started RindoApplication" arranque.log; then
            echo "ERROR: el binario nativo no completo el arranque"
            exit 1
          fi

          echo "Comprobando /actuator/health..."
          curl -fsS --retry 5 --retry-delay 2 http://localhost:8080/actuator/health
          echo

          kill "$PID" 2>/dev/null || true
          echo "OK: el binario nativo arranca y responde"

      - name: Publicar el binario
        uses: actions/upload-artifact@v4
        with:
          name: rindo-nativo-linux-x64
          path: backend/target/rindo
          retention-days: 7
